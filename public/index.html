<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Material Sharing - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome in Harihar's File Manager</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn" id="loginBtn">Login</button>
                <div id="loginError" class="text-center mt-1" style="color: var(--danger-color); font-size: 0.9rem; display: none;"></div>
            </form>
            <p class="mt-2" style="font-size: 0.9rem;">
                Don't have an account? <a href="#" id="showSignup" style="color: var(--primary-color);">Sign Up</a>
            </p>
        </div>
        
        <div class="auth-card hidden" id="signupCard">
            <h2>Create Account</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" class="form-control" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" class="form-control" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" class="form-control" required placeholder="Min 6 characters">
                </div>
                <button type="submit" class="btn" id="signupBtn">Sign Up</button>
                <div id="signupError" class="text-center mt-1" style="color: var(--danger-color); font-size: 0.9rem; display: none;"></div>
            </form>
            <p class="mt-2" style="font-size: 0.9rem;">
                Already have an account? <a href="#" id="showLogin" style="color: var(--primary-color);">Login</a>
            </p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Toggle between Login and Signup cards
        document.getElementById('showSignup').addEventListener('click', (e) => {
            e.preventDefault();
            document.querySelector('.auth-card').classList.add('hidden');
            document.getElementById('signupCard').classList.remove('hidden');
        });

        document.getElementById('showLogin').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('signupCard').classList.add('hidden');
            document.querySelector('.auth-card').classList.remove('hidden');
        });
    </script>
</body>
</html>
